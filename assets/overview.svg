    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#50736b"/><stop offset="1" stop-color="#d6fba7"/></linearGradient>
  </defs>
  <rect width="1440" height="480" rx="22" fill="url(#bg)"/>
  <g fill="none" stroke="#64877b" opacity=".16" stroke-width="1.5">
    <path d="M780 475 1050 95 1250 360 1350 200 1450 365"/>
    <path d="M815 475 1050 145 1235 395 1350 250 1450 412"/>
    <path d="M850 475 1050 195 1220 430 1350 300 1450 459"/>
